name: Build & Release Package Distribution

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Package Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏷️ Resolve Package Version & Tag
        id: resolve-version
        run: |
          python -c '
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          ver = data.get("project", {}).get("version", "1.0.0")
          tag = f"v{ver}"
          print(f"Versión detectada: {ver} -> Tag: {tag}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RELEASE_TAG={tag}\n")
              env.write(f"PACKAGE_VERSION={ver}\n")
          '

      - name: 🛠️ Build distribution packages (wheel & sdist)
        run: |
          python -m build

      - name: ✅ Check package validity with Twine
        run: |
          twine check dist/*

      - name: 🚀 Publish or Update GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || env.RELEASE_TAG }}
          name: ${{ github.event.release.name || format('v{0} - Distribución Oficial', env.PACKAGE_VERSION) }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

